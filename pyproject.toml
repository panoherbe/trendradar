[project]
name = "trendradar"
version = "0.1.0"
description = "Prototyp: Megatrends und Subtrends treffen die Fähigkeiten regionaler Unternehmen, jede Bewertung mit Beleg"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "jinja2==3.1.5",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "pyyaml==6.0.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
pipeline = [
    "httpx==0.28.1",
    "protego==0.3.1",
    "trafilatura==2.0.0",
    "numpy==2.2.1",
]
# nur für Einbettungsmodelle ohne Ollama (z. B. BAAI/bge-m3, Stand 04.11.2026)
bge = ["sentence-transformers==3.3.1"]
test = ["pytest==8.3.4", "httpx==0.28.1", "numpy==2.2.1", "protego==0.3.1", "lxml==5.3.0"]

[tool.setuptools.packages.find]
include = ["trendradar*"]

[tool.setuptools.package-data]
trendradar = ["templates/*.html", "static/*", "schema.sql"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
