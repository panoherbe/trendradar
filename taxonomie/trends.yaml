        beschreibung: "Wir planen und installieren Wärmepumpen, Erdwärmesonden, Heizungsanlagen und Lüftungsanlagen mit Wärmerückgewinnung."
        begriffe: ["wärmepumpe", "erdwärme", "erdwärmesonde", "sole-wasser", "luft-wasser", "heizungsanlage", "heizungsinstallation", "heizungsbau", "lüftungsanlage", "wärmerückgewinnung", "flächenheizung", "fußbodenheizung", "raumlufttechnik"]
        cpv: ["45331", "42511110"]
      - id: S002-F3
