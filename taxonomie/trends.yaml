    beschreibung: "Bestandsgebäude müssen bis 2045 weitgehend ohne fossile Heizung auskommen, Gebäudehülle und Haustechnik werden dafür erneuert. Für das regionale Bauhandwerk ist das die größte absehbare Sanierungswelle."
