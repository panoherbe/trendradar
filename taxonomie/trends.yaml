        name: "PV-Montage auf Dach und Fläche"
        beschreibung: "Wir montieren Photovoltaikanlagen auf Dächern, Fassaden, Carports und Freiflächen einschließlich Dachdurchdringung und Statik."
        begriffe: ["photovoltaik", "pv-anlage", "pv anlage", "solaranlage", "solardach", "solarcarport", "freiflächenanlage", "agri-pv", "balkonkraftwerk", "solarpark"]
        cpv: ["09332", "45261215"]
      - id: S001-F3
        name: "Elektroanschluss & Netzeinspeisung"
        beschreibung: "Wir übernehmen Elektroinstallation, Zählerplatz, Netzanschluss und Inbetriebnahme von Erzeugungs- und Speicheranlagen."
