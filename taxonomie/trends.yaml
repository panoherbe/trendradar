# Trend-Taxonomie des Trend-Radars (Prototyp)
# Eigene Formulierung, Lizenz AGPL-3.0-only wie der Quellcode. Keine Übernahme fremder Trendmodelle oder -texte.
#
# Aufbau: Megatrend -> Subtrend -> Teilfähigkeit („Fähigkeits-Brücke“).
# Ein Unternehmen passt zu einem Subtrend über Belege für eine oder mehrere Teilfähigkeiten.
# Die Teilfähigkeiten eines Subtrends ergänzen sich entlang der Wertschöpfung
# (Material/Komponenten -> Fertigung/Errichtung -> Steuerung/Software -> Betrieb/Service),
# damit der Kooperationsfinder Gruppen regionaler Firmen bilden kann, die gemeinsam alles abdecken.
#
# begriffe: kleingeschriebene Wortstämme, die als Teilzeichenkette in Firmentexten gesucht werden.
# cpv:      CPV-Präfixe (4-8 Ziffern); ein Präfix trifft alle darunterliegenden Codes.

version: "2026-11-04b"
titel: "Beispiel-Taxonomie (eigene Formulierung, AGPL-3.0-only)"

megatrends:
  - id: M01
    name: "Klima & Energie"
    farbe: "#1b7f5b"
    beschreibung: "Strom und Wärme sollen erneuerbar erzeugt, klug verteilt und sparsam genutzt werden, während Hitze und Starkregen häufiger werden. Daraus entstehen Aufträge für Gebäudetechnik, Netzbau, neue Energieträger und Vorsorge."
    subtrends: [S001, S003, S002, S021, S004, S005]
  - id: M02
    name: "Ressourcen & Kreislaufwirtschaft"
    farbe: "#8c564b"
    beschreibung: "Rohstoffe werden knapper und teurer, deshalb sollen Materialien länger genutzt, zurückgewonnen und wieder eingesetzt werden. Die Region bringt dafür Bergbau-, Werkstoff- und Entsorgungswissen mit."
    subtrends: [S010, S006, S007, S009, S024, S008]
  - id: M03
    name: "Digitalisierung & Vernetzung"
    farbe: "#0072b2"
    beschreibung: "Netze, Rechenleistung und digitale Abläufe werden zur Grundausstattung von Verwaltung, Schulen und Betrieben. Gefragt sind Leitungsbau, IT-Betrieb, Fachsoftware und deren Absicherung."
    subtrends: [S011, S012, S013, S034, S032, S039]
  - id: M04
    name: "Automatisierung & KI"
    farbe: "#6a3d9a"
    beschreibung: "Maschinen, Sensoren und lernende Software übernehmen Routinearbeit in Fertigung und Planung. Für den Maschinenbau- und Elektronikstandort Südwestsachsen ist das Chance und Anpassungsdruck zugleich."
    subtrends: [S018, S017, S014, S015, S016, S019]
  - id: M05
    name: "Mobilitätswandel"
    farbe: "#d55e00"
    beschreibung: "Antriebe werden elektrisch oder wasserstoffbasiert, Fahrzeuge leichter, und Bahn, Bus und Rad gewinnen Gewicht. Die Zulieferregion um Zwickau muss Produkte und Verfahren darauf umstellen."
    subtrends: [S020, S024, S021, S004, S022, S023]
  - id: M06
    name: "Gesundheit & Pflege"
    farbe: "#cc79a7"
    beschreibung: "Mehr Behandlungsbedarf, strengere Hygiene und digitale Versorgung verändern Kliniken, Praxen und Pflegeeinrichtungen. Regionale Betriebe liefern Ausstattung, Bau, Reinigung, Textilien und Software."
    subtrends: [S025, S027, S028, S026, S029, S044]
  - id: M07
    name: "Demografischer Wandel"
    farbe: "#56b4e9"
    beschreibung: "Die Bevölkerung der Region altert, zugleich kommen Zugewanderte und junge Familien hinzu. Wohnen, Mobilität, Betreuung und Betriebsnachfolge müssen sich auf neue Altersstrukturen einstellen."
    subtrends: [S040, S031, S023, S030, S029, S045]
  - id: M08
    name: "Stadt, Land & Wohnen"
    farbe: "#999933"
    beschreibung: "Städte und Dörfer sollen bezahlbaren, energiesparenden und gut angebundenen Wohnraum bieten. Das treibt Sanierung, Neubau, Breitband und vernetzte kommunale Infrastruktur."
    subtrends: [S033, S002, S030, S011, S032, S005]
  - id: M09
    name: "Sicherheit & Resilienz"
    farbe: "#555555"
    beschreibung: "Hochwasser, Cyberangriffe, gestörte Lieferketten und alternde Infrastruktur zeigen, wie verletzlich Versorgung und Betriebe sind. Vorsorge, Schutztechnik und Instandhaltung werden zur Daueraufgabe."
    subtrends: [S005, S035, S036, S034, S037, S038]
  - id: M10
    name: "Bildung & Wissen"
    farbe: "#882255"
    beschreibung: "Schulen, Hochschulen und Weiterbildung brauchen moderne Räume, digitale Ausstattung und Forschungstechnik. Wissen aus Chemnitz, Zwickau und Freiberg soll schneller in Betriebe und Gründungen fließen."
    subtrends: [S040, S039, S041, S042, S043]
  - id: M11
    name: "Arbeitswelt & Fachkräfte"
    farbe: "#e69f00"
    beschreibung: "Fachkräfte werden knapp, Belegschaften älter und Arbeitsorte flexibler. Betriebe investieren in Qualifizierung, Entlastung durch Technik, Arbeitsschutz und gesunde Arbeitsbedingungen."
    subtrends: [S041, S015, S046, S044, S047, S045]

subtrends:
  - id: S001
    name: "Photovoltaik & Speicher"
    beschreibung: "Dächer, Fassaden und Freiflächen werden zu Kraftwerken, Batteriespeicher glätten Eigenverbrauch und Netzlast. Gefragt sind Montage, Elektroanschluss und Betriebsführung kleiner und mittlerer Anlagen."
    megatrends: [M01]
    faehigkeiten:
      - id: S001-F1
        name: "Module, Wechselrichter & Batterien"
